<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROUNDandLAW — Чат</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- ===== БОКОВАЯ ПАНЕЛЬ ===== -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-mark">G</div>
                <div class="logo-text">GROUNDandLAW</div>
            </div>
            <button class="new-chat-btn" id="newChatBtn">
                <svg viewBox="0 0 24 24">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Новый чат</span>
            </button>
            <div class="chat-list">
                <div class="chat-list-label">Активные</div>
                <div id="chatList"><!-- чаты рендерятся здесь --></div>
            </div>
        </aside>

        <!-- ===== ОСНОВНАЯ ОБЛАСТЬ ===== -->
        <main class="main" id="mainContent">
            <!-- Стартовый экран -->
            <div class="start-screen page" id="startScreen">
                <h1 class="start-title">Чем могу помочь? <span>GROUNDandLAW</span></h1>
                <div class="input-container">
                    <div class="attachments-preview" id="startAttachments"></div>
                    <div class="input-row">
                        <textarea class="input-field" placeholder="Спросите что-нибудь..." rows="1" id="startInput"></textarea>
                    </div>
                    <div class="input-row input-row-bottom">
                        <div class="input-actions">
                            <button class="action-btn" id="startAttachBtn" title="Прикрепить файл">
                                <svg viewBox="0 0 24 24">
                                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                                </svg>
                            </button>
                            <button class="action-btn" title="Записать голосовое">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                    <line x1="12" y1="19" x2="12" y2="23"></line>
                                    <line x1="8" y1="23" x2="16" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <button class="send-btn" id="startSendBtn" title="Отправить">
                            <svg viewBox="0 0 24 24">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Экран чата -->
            <div class="chat-view page" id="chatView">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <div class="input-container">
                        <div class="attachments-preview" id="chatAttachments"></div>
                        <div class="input-row">
                            <textarea class="input-field" placeholder="Напишите сообщение..." rows="1" id="chatInput"></textarea>
                        </div>
                        <div class="input-row input-row-bottom">
                            <div class="input-actions">
                                <button class="action-btn" id="chatAttachBtn" title="Прикрепить файл">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                                    </svg>
                                </button>
                                <button class="action-btn" title="Записать голосовое">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                        <line x1="12" y1="19" x2="12" y2="23"></line>
                                        <line x1="8" y1="23" x2="16" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                            <button class="send-btn" id="chatSendBtn" title="Отправить">
                                <svg viewBox="0 0 24 24">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Скрытые file input -->
    <input type="file" id="startFileInput" multiple hidden>
    <input type="file" id="chatFileInput" multiple hidden>

    <!-- Индикатор загрузки -->
    <div class="app-loader" id="appLoader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Загрузка чатов…</div>
    </div>

    <script src="db.js"></script>
    <script src="script.js"></script>
</body>
</html>
