# Initial HTTP deployment by IP. Replace the exact origin when adding HTTPS/domain.
map $http_origin $groundandlaw_origin {
    default $http_origin;
    "http://186.246.14.157" "http://127.0.0.1:8080";
}
limit_req_zone $binary_remote_addr zone=groundandlaw_requests:10m rate=6r/m;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name 186.246.14.157;
    client_max_body_size 8m;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host 127.0.0.1:8080;
        proxy_set_header Origin $groundandlaw_origin;
        proxy_read_timeout 150s;
        proxy_buffering off;
    }
    location = /api/legal-help {
        limit_req zone=groundandlaw_requests burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host 127.0.0.1:8080;
        proxy_set_header Origin $groundandlaw_origin;
        proxy_read_timeout 150s;
        proxy_buffering off;
    }
}
